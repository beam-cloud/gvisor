name: CI

"on":
  workflow_dispatch:
    inputs:
      checkpoint_version:
        description: 'Compatible checkpoint commit (12 hex digits; empty uses source revision)'
        required: false
        type: string
  push:
    branches:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: bazel
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo -E apt update && sudo -E apt install -y make

    - name: Checkout
      uses: actions/checkout@v5

    - name: build
      env:
        CHECKPOINT_VERSION: ${{ inputs.checkpoint_version }}
      run: |
          mkdir -p bin
          [[ -z "$CHECKPOINT_VERSION" || "$CHECKPOINT_VERSION" =~ ^[0-9a-f]{12}$ ]]
          make copy TARGETS=runsc DESTINATION=bin/ BAZEL_OPTIONS="--workspace_status_command='tools/workspace_status.sh $CHECKPOINT_VERSION'"

    - name: Upload runsc
      uses: actions/upload-artifact@v4
      with:
          name: runsc
          path: bin/runsc
